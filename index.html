<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 HTML Viewer</h1>
            <p>عرض ومعاينة ملفات HTML بسهولة</p>
        </header>

        <div class="main-content">
            <div class="editor-section">
                <div class="section-header">
                    <h2>محرر HTML</h2>
                    <div class="button-group">
                        <button id="clearBtn" class="btn btn-danger">حذف</button>
                        <button id="downloadBtn" class="btn btn-info">تحميل</button>
                        <button id="uploadBtn" class="btn btn-success">رفع ملف</button>
                        <input type="file" id="fileInput" accept=".html,.htm" style="display:none;">
                    </div>
                </div>
                <textarea id="htmlEditor" placeholder="ألصق كود HTML هنا..."></textarea>
            </div>

            <div class="preview-section">
                <div class="section-header">
                    <h2>المعاينة</h2>
                    <button id="refreshBtn" class="btn btn-primary">تحديث</button>
                </div>
                <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
