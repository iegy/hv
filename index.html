<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HV — Advanced HTML Viewer</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>مستعرض HTML متقدّم</h1>
      <div class="controls">
        <label><input type="checkbox" id="autoUpdate" checked> تحديث تلقائي</label>
        <label><input type="checkbox" id="allowScripts"> تشغيل JavaScript</label>
        <label><input type="checkbox" id="sanitize" checked> تعقيم (DOMPurify)</label>
        <label><input type="checkbox" id="rtlToggle"> وضع RTL</label>
        <select id="device">
          <option value="">جهاز: responsive</option>
          <option value="375">iPhone 6/7/8 (375px)</option>
          <option value="768">Tablet (768px)</option>
          <option value="1024">Desktop (1024px)</option>
        </select>
        <button id="formatBtn">تنسيق</button>
        <button id="minifyBtn">تصغير</button>
        <button id="downloadBtn">تحميل</button>
        <button id="copyBtn">نسخ</button>
        <button id="fullscreenBtn">تكبير</button>
      </div>
    </header>

    <main class="workspace">
      <section class="editor-pane">
        <div id="editor" class="editor"></div>
      </section>

      <section class="preview-pane">
        <div class="preview-toolbar">المعاينة</div>
        <iframe id="preview" sandbox="allow-forms allow-same-origin" title="preview"></iframe>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
    <!-- Libraries loaded from CDN for quick setup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.15.0/ace.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js" defer></script>
  </body>
</html>
